<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="xenArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="xenRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="xenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Deep Ribbon Backing forming '9' and 'X' curve -->
  <path d="M 68 152 C 40 142 30 108 48 78 C 66 48 98 42 122 62 C 140 76 142 98 128 118 L 62 162 C 45 173 24 150 42 130 L 115 38" 
        stroke="url(#xenRibbon)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Cyan Arrow Shooting Up-Right -->
  <path d="M 48 148 C 72 118 102 88 148 44" 
        stroke="url(#xenArrow)" stroke-width="20" stroke-linecap="round" filter="url(#xenGlow)" />
  <!-- Arrow Head Tip -->
  <path d="M 132 32 L 172 26 L 166 66 Z" fill="url(#xenArrow)" filter="url(#xenGlow)" />
  <!-- Circuit Nodes & Core Glow -->
  <g filter="url(#xenGlow)">
    <path d="M 82 108 L 62 118 M 88 122 L 72 138 M 108 84 L 128 74 M 102 68 L 118 52" 
          stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="62" cy="118" r="4" fill="#e0f2fe" />
    <circle cx="72" cy="138" r="3.5" fill="#38bdf8" />
    <circle cx="128" cy="74" r="4" fill="#e0f2fe" />
    <circle cx="118" cy="52" r="3.5" fill="#38bdf8" />
    <!-- Center Pulse Core -->
    <circle cx="96" cy="96" r="6" fill="#ffffff" />
    <circle cx="96" cy="96" r="13" fill="#06b6d4" opacity="0.5" />
    <line x1="96" y1="80" x2="96" y2="112" stroke="#ffffff" stroke-width="2" />
    <line x1="80" y1="96" x2="112" y2="96" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>
